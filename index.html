<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi - SDIT Qudwatun Hasanah</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root{
  --or:#FF6B35;--or2:#FFF0E8;--tl:#0ABAB5;--tl2:#E0FAFA;
  --pu:#6C47FF;--pu2:#EEE9FF;--gn:#06C270;--gn2:#E6FAF0;
  --rd:#FF4D6D;--rd2:#FFE8EC;--bk:#1A1D20;--gy:#6C757D;
  --bg:#F8F9FA;--card:#FFFFFF;--border:#E9ECEF;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background-color:var(--bg);color:var(--bk);padding-bottom:60px}
.header{background:linear-gradient(135deg,var(--tl),#08908c);color:#fff;padding:40px 20px;text-align:center;border-bottom-left-radius:30px;border-bottom-right-radius:30px;box-shadow:0 10px 25px rgba(10,186,181,0.15)}
.header h1{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px}
.header p{font-size:14px;opacity:0.9;font-family:'DM Sans',sans-serif}
.container{max-width:1000px;margin:0 auto;padding:20px}
.main-grid{display:grid;grid-template-columns:1fr;gap:25px;margin-top:-20px}
@media(min-width:768px){.main-grid{grid-template-columns:1.2fr 1.8fr}}
.card{background:var(--card);border-radius:24px;padding:24px;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,0.02)}
.card-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:var(--bk)}
.card-title span{width:8px;height:20px;background:var(--tl);border-radius:4px;display:inline-block}
#reader{width:100%!important;border:none!important;border-radius:20px;overflow:hidden;background:var(--bg)}
#reader__scan_region{background:#fff;border-radius:16px}
#reader__dashboard{padding:15px!important;background:var(--bg);border-radius:12px;margin-top:12px}
#reader__dashboard button{background:var(--tl);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--gy)}
.form-control{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--bk);background:var(--bg);transition:all 0.2s}
.form-control:focus{outline:none;border-color:var(--tl);background:#fff;box-shadow:0 0 0 4px var(--tl2)}
.btn-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.btn{padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;font-family:'Plus Jakarta Sans',sans-serif}
.btn-tl{background:var(--tl);color:#fff}.btn-tl:hover{background:#09a09b}
.btn-or{background:var(--or2);color:var(--or)}.btn-or:hover{background:#ffe6db}
.btn-pu{background:var(--pu2);color:var(--pu)}.btn-pu:hover{background:#e3daff}
.btn-rd{background:var(--rd2);color:var(--rd)}.btn-rd:hover{background:#ffd4dc}
.btn-block{grid-column:span 2}
.log-list{display:flex;flex-direction:column;gap:12px;max-height:480px;overflow-y:auto;padding-right:5px}
.log-item{background:var(--bg);padding:14px 18px;border-radius:16px;border:1px solid var(--border);display:flex;align-items:center;justify-content:between;transition:transform 0.2s}
.log-item:hover{transform:translateY(-2px)}
.log-info{flex:1}
.log-name{font-size:14px;font-weight:700;color:var(--bk);margin-bottom:4px}
.log-meta{font-size:12px;color:var(--gy);display:flex;gap:12px;font-family:'DM Sans',sans-serif}
.badge{padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.bg-hadir{background:var(--gn2);color:var(--gn)}
.bg-izin{background:var(--or2);color:var(--or)}
.bg-sakit{background:var(--pu2);color:var(--pu)}
.bg-alpha{background:var(--rd2);color:var(--rd)}
.toast{position:fixed;bottom:20px;left:51%;transform:translateX(-50%);background:var(--bk);color:#fff;padding:12px 24px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);z-index:9999;display:none;align-items:center;gap:10px}
.search-bar{margin-bottom:15px;display:flex;gap:10px}
.empty-state{text-align:center;padding:40px 20px;color:var(--gy);font-family:'DM Sans',sans-serif;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <h1>SDIT Qudwatun Hasanah</h1>
  <p>Sistem Absensi Kehadiran Guru & Staf Berbasis QR Code</p>
</div>

<div class="container">
  <div class="main-grid">
    
    <div style="display:flex;flex-direction:column;gap:25px">
      <div class="card" style="margin-top:0">
        <div class="card-title"><span></span>Scanner QR Code</div>
        <div id="reader"></div>
      </div>
      
      <div class="card">
        <div class="card-title"><span></span>Input Manual / Ketidakhadiran</div>
        <div class="form-group">
          <label>ID GURU</label>
          <input type="text" id="inpId" class="form-control" placeholder="Contoh: G32710">
        </div>
        <div class="form-group">
          <label>KETERANGAN (OPSIONAL)</label>
          <input type="text" id="inpKet" class="form-control" placeholder="Alasan izin/sakit/terlambat">
        </div>
        
        <div class="btn-row">
          <button class="btn btn-tl btn-block" onclick="prosesManual('hadir','masuk')">⚡ Absen Hadir Masuk</button>
          <button class="btn btn-or" onclick="prosesManual('izin','tidak masuk')">📄 Izin</button>
          <button class="btn btn-pu" onclick="prosesManual('sakit','tidak masuk')">🏥 Sakit</button>
          <button class="btn btn-rd btn-block" onclick="prosesManual('alpha','tidak masuk')">⚠️ Tandai Alpha</button>
        </div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title" style="justify-content:space-between;margin-bottom:15px">
        <div style="display:flex;align-items:center;gap:10px"><span></span>Riwayat Kehadiran Hari Ini</div>
        <button class="btn btn-pu" style="padding:8px 16px;border-radius:10px;font-size:12px" onclick="cetakPDF()">🖨️ Cetak PDF</button>
      </div>
      
      <div class="search-bar">
        <input type="text" id="cariNama" class="form-control" placeholder="Cari nama guru..." oninput="renderLogs()">
      </div>
      
      <div class="log-list" id="logList">
        <div class="empty-state">Belum ada data absensi hari ini.</div>
      </div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// =================================================================
// 1. ISI CONFIG FIREBASE SESUAI DENGAN SCREENSHOT KEDUA KAMU
// =================================================================
const firebaseConfig = {
  apiKey: "AIzaSyD9dljqCBwnntZCGooUd5gVrC7miiY2bd0", 
  authDomain: "absensi-sdit.firebaseapp.com",
  databaseURL: "https://absensi-sdit-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absensi-sdit",
  storageBucket: "absensi-sdit.appspot.com",
  messagingSenderId: "179050530066", 
  appId: "1:179050530066:web:b35c07d59c435365bb5fcb" 
};

// Inisialisasi Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let riwayatAbsenHariIni = [];
let html5QrcodeScanner;
let isProcessing = false;

// Format Tanggal Hari Ini (YYYY-MM-DD) untuk Node Firebase
function getTglSkg() {
  const d = new Date();
  const bln = String(d.getMonth() + 1).padStart(2, '0');
  const tgl = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${bln}-${tgl}`;
}

// Format Jam Skg (HH:MM:SS)
function getJamSkg() {
  const d = new Date();
  return [String(d.getHours()).padStart(2,'0'), String(d.getMinutes()).padStart(2,'0'), String(d.getSeconds()).padStart(2,'0')].join(':');
}

// Tampilkan Pesan Toast
function toast(msg, type='info') {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.style.display = 'flex';
  if(type==='err') t.style.backgroundColor='#FF4D6D';
  else if(type==='success') t.style.backgroundColor='#06C270';
  else t.style.backgroundColor='#1A1D20';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// 2. LISTEN DATA ABSENSI DARI FIREBASE SECARA REALTIME
function listenAbsensiHariIni() {
  const tglRef = database.ref('absensi_harian/' + getTglSkg());
  tglRef.on('value', (snapshot) => {
    riwayatAbsenHariIni = [];
    if (snapshot.exists()) {
      snapshot.forEach((childSnapshot) => {
        riwayatAbsenHariIni.push(childSnapshot.val());
      });
      // Urutkan dari yang paling baru absen
      riwayatAbsenHariIni.reverse();
    }
    renderLogs();
  });
}

// Render data riwayat ke layar HTML
function renderLogs() {
  const list = document.getElementById('logList');
  const keyword = document.getElementById('cariNama').value.toLowerCase();
  list.innerHTML = '';
  
  const filtered = riwayatAbsenHariIni.filter(x => x.Nama.toLowerCase().includes(keyword));
  
  if(filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">Tidak ada data absensi ditemukan.</div>';
    return;
  }
  
  filtered.forEach(x => {
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <div class="log-info">
        <div class="log-name">${x.Nama}</div>
        <div class="log-meta">
          <span>🆔 ${x.ID_Guru}</span>
          <span>💼 ${x.Mapel}</span>
          <span>⏰ ${x.Waktu}</span>
          ${x.Keterangan ? `<span>📝 ${x.Keterangan}</span>` : ''}
        </div>
      </div>
      <span class="badge bg-${x.Status}">${x.Status}</span>
    `;
    list.appendChild(item);
  });
}

// 3. FUNGSI UTAMA PROSES ABSENSI
function eksekusiAbsen(idGuru, status, tipe, keterangan="") {
  if(isProcessing) return;
  isProcessing = true;
  
  idGuru = idGuru.trim().toUpperCase();
  if(!idGuru) {
    toast('ID Guru tidak boleh kosong!','err');
    isProcessing = false;
    return;
  }

  // Cari nama guru langsung ke node 'daftar_guru' di Firebase kamu
  database.ref('daftar_guru/' + idGuru).once('value')
    .then((snapshot) => {
      if(!snapshot.exists()) {
        toast(`ID Guru ${idGuru} tidak ditemukan di sistem!`, 'err');
        isProcessing = false;
        return;
      }
      
      const profilGuru = snapshot.val();
      const jamSekarang = getJamSkg();
      const tglSekarang = getTglSkg();
      
      // Tentukan status otomatis jika datang terlambat (Misal batas jam 08:00)
      let statusFinal = status;
      if (status === 'hadir' && jamSekarang > '08:00:00') {
        statusFinal = 'terlambat';
      }

      const dataData = {
        Tanggal: tglSekarang,
        ID_Guru: idGuru,
        Nama: profilGuru.nama,
        Mapel: profilGuru.jabatan,
        Status: statusFinal,
        Tipe: tipe,
        Waktu: jamSekarang,
        Keterangan: keterangan
      };

      // Simpan log absensi ke Firebase berdasarkan tanggal hari ini
      database.ref(`absensi_harian/${tglSekarang}`).push(dataData)
        .then(() => {
          toast(`✅ ${profilGuru.nama} berhasil absen (${statusFinal})!`, 'success');
          document.getElementById('inpId').value = '';
          document.getElementById('inpKet').value = '';
          setTimeout(() => { isProcessing = false; }, 2500); // Jeda anti-double scan
        });
    })
    .catch((err) => {
      console.error(err);
      toast('Terjadi kesalahan jaringan Firebase!', 'err');
      isProcessing = false;
    });
}

// Fungsi tombol manual
function prosesManual(status, tipe) {
  const id = document.getElementById('inpId').value;
  const ket = document.getElementById('inpKet').value;
  eksekusiAbsen(id, status, tipe, ket);
}

// Fungsi otomatis saat kamera mendeteksi QR Code
function onScanSuccess(decodedText) {
  if(isProcessing) return;
  eksekusiAbsen(decodedText, 'hadir', 'masuk', '');
}

// Mengaktifkan kamera scanner
function initScanner() {
  html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
  html5QrcodeScanner.render(onScanSuccess, (err) => {});
}

// 4. FUNGSI CETAK LAPORAN PDF LANGSUNG DARI FIREBASE
function cetakPDF(){
  if(riwayatAbsenHariIni.length===0){toast('Tidak ada data untuk dicetak hari ini','err');return;}
  
  const d = new Date();
  const tglStr = d.toLocaleDateString('id-ID',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
