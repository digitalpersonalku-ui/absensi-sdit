<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi SDIT Qudwatun Khasanah</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #007bff;
      text-align: center;
      padding: 10px;
      background: #e9ecef;
      border-radius: 5px;
      width: 90%;
      max-width: 400px;
    }
    .loading {
      color: #ff9800 !important;
    }
    .success {
      color: #4caf50 !important;
    }
    .error {
      color: #f44336 !important;
    }
  </style>
</head>
<body>

  <h1>Absensi SDIT Qudwatun Khasanah</h1>
  <div id="reader"></div>
  <div id="result">Scan QR Code Siswa untuk Absen</div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // 2. KONFIGURASI FIREBASE (Sesuaikan dengan data dari Project Settings Firebase kamu)
    const firebaseConfig = {
      apiKey: "AIzaSy...", // Ambil dari langkah sebelumnya di Firebase Console
      authDomain: "absensi-sdit.firebaseapp.com",
      databaseURL: "https://absensi-sdit-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "absensi-sdit",
      storageBucket: "absensi-sdit.appspot.com",
      messagingSenderId: "...", 
      appId: "..." 
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Kontrol scan agar tidak mengirim data berkali-kali secara tidak sengaja
    let isScanning = true;

    // Fungsi untuk menyalakan Kamera / Scanner
    function onScanSuccess(decodedText, decodedResult) {
      if (!isScanning) return; // Jika sedang memproses data, abaikan scan baru sementara

      isScanning = false; 
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Memproses absensi...";
      resultDiv.className = "loading";

      // Memanggil fungsi simpan ke Firebase
      kirimDataKeFirebase(decodedText);
    }

    function onScanFailure(error) {
      // Diabaikan agar konsol tidak penuh dengan log error pencarian QR
    }

    // 3. FUNGSI BARU UNTUK MENYIMPAN DATA KE FIREBASE
    function kirimDataKeFirebase(qrData) {
      const resultDiv = document.getElementById("result");
      
      // Mengambil waktu lokal saat scan dilakukan
      const sekarang = new Date();
      const tanggal = sekarang.toLocaleDateString('id-ID'); // Format: DD/MM/YYYY
      const jam = sekarang.toLocaleTimeString('id-ID');     // Format: HH.MM.SS

      // Membuat data objek absensi
      const dataAbsen = {
        idSiswa: qrData,
        waktuScan: jam,
        tanggalScan: tanggal
      };

      // Menyimpan ke Firebase di dalam folder 'absensi_harian' dengan ID acak unik (push)
      database.ref('absensi_harian').push(dataAbsen)
        .then(() => {
          resultDiv.innerHTML = `✅ Berhasil Absen!<br>Siswa: ${qrData}<br>Jam: ${jam}`;
          resultDiv.className = "success";
          
          // Berikan jeda 3 detik sebelum scanner bisa digunakan kembali
          setTimeout(() => {
            resultDiv.innerHTML = "Scan QR Code Siswa untuk Absen";
            resultDiv.className = "";
            isScanning = true;
          }, 3000);
        })
        .catch((error) => {
          console.error("Firebase Error: ", error);
          resultDiv.innerHTML = "❌ Gagal menyimpan data ke server.";
          resultDiv.className = "error";
          isScanning = true; // Buka kembali scanner jika gagal
        });
    }

    // Jalankan library scanner html5-qrcode
    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: 250 }
    );
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
