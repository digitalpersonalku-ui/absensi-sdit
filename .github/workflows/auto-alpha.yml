name: Auto Alpha Absensi

on:
  schedule:
    # Tiap 15 menit, jam 00:00–06:59 UTC = 07:00–13:59 WIB, Senin–Sabtu (UTC).
    # Cakupan jam sengaja dilebarkan supaya aman kalau jam_alpha diubah-ubah
    # Admin lewat Setting — skrip sendiri yang menentukan apakah ini "saat
    # yang tepat" berdasarkan nilai jam_alpha aktual, cron ini cuma jadwal
    # "pengecekan", bukan waktu pastinya.
    - cron: '*/15 0-6 * * 1-6'
  workflow_dispatch: {} # supaya bisa dites manual lewat tab Actions di GitHub

jobs:
  auto-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan pengecekan auto-Alpha
        run: node .github/scripts/auto-alpha.js
